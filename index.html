<script>
// ---------- 零件定义 ----------
// 坐标：X 沿曲轴（四缸一排），+X = 正时端；+Y 向上；-Z 进气侧（后），+Z 排气侧（前）
const PARTS = {
 head:  {name:'缸盖', desc:'盖在气缸顶上，围出燃烧室；火花塞和凸轮轴都装在它上面。'},
 cam:   {name:'凸轮轴', desc:'转起来用凸起顶开气门，决定什么时候进气、排气。'},
 belt:  {name:'正时皮带', desc:'让曲轴和凸轮轴同步转，气门开合才能对上活塞。'},
 plug:  {name:'火花塞', desc:'在气缸里打出电火花，点燃油气。每个缸一个。'},
 coil:  {name:'点火线圈', desc:'把 12V 电升到上万伏，送给火花塞打火。'},
 intake:{name:'进气歧管', desc:'把空气分成四路，送进四个气缸。'},
 wrench:{name:'扳手', fake:1, desc:'车间工具，不是零件。拧完螺丝要拿走，别落在机舱里。', quip:'扔了，扳手是工具，不是发动机的零件。'},
 spring:{name:'弹簧', fake:1, desc:'杂物箱里的普通螺旋弹簧，这台发动机上没有它的位置。', quip:'扔了，这根弹簧不是这台发动机的。'},
 faucet:{name:'水龙头阀门', fake:1, desc:'水管上用的阀门。发动机里的「气门」长得完全不一样。', quip:'扔了，这是水管阀门，不是发动机的气门。'},
 banana:{name:'香蕉', fake:1, desc:'谁的午饭落在零件堆里了？', quip:'扔了……香蕉只会在缸盖里烤熟。'},
};
const SLOTS = [
 {id:'head', part:'head', pos:[0,1.15,0], needs:[]},
 {id:'cam', part:'cam', pos:[0,1.82,-0.42], needs:['head']},
 {id:'intake', part:'intake', pos:[0,1.2,-1.05], needs:['head']},
 {id:'p1', part:'plug', pos:[-1.2,1.58,0.15], needs:['head']},
 {id:'p2', part:'plug', pos:[-0.4,1.58,0.15], needs:['head']},
 {id:'p3', part:'plug', pos:[0.4,1.58,0.15], needs:['head']},
 {id:'p4', part:'plug', pos:[1.2,1.58,0.15], needs:['head']},
 {id:'coil', part:'coil', pos:[0,1.86,0.15], needs:['p1','p2','p3','p4']},
 {id:'belt', part:'belt', pos:[2.05,0.75,-0.2], needs:['cam']},
];
const NEED_TXT = {
 cam:'得先装缸盖：凸轮轴是架在缸盖上的。', intake:'得先装缸盖：进气歧管要拧在缸盖进气口上。',
 plug:'得先装缸盖：火花塞孔在缸盖上。', coil:'得先装完 4 个火花塞：线圈要压在火花塞头上。',
 belt:'得先装凸轮轴：皮带要同时套住曲轴轮和凸轮轴轮。'};
const WRONG = {
 plug:'火花塞要拧进缸盖顶上那排孔里，每缸一个。',
 coil:'点火线圈压在那排火花塞头上，给它们供高压电。',
 belt:'正时皮带在发动机侧面（正时端），连着曲轴和凸轮轴。',
 cam:'凸轮轴横躺在缸盖上，沿四个缸一字排开。',
 intake:'进气歧管装在后侧（进气侧），前侧是排气。',
 head:'缸盖要盖在缸体正上方。'};
const TOTAL = SLOTS.length;
const PART_RADIUS = {head:0.9,cam:0.45,belt:0.55,plug:0.22,coil:0.55,intake:0.55,wrench:0.4,spring:0.35,faucet:0.35,banana:0.35};

// ---------- Three 场景 ----------
const view=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
view.prepend(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color('#2b3036');
const camera=new THREE.PerspectiveCamera(40,1,0.1,100);
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,0.9));
const dl=new THREE.DirectionalLight(0xffffff,0.8); dl.position.set(4,8,6); scene.add(dl);
const engine=new THREE.Group(); scene.add(engine);
const mat=c=>new THREE.MeshLambertMaterial({color:c});
const ground=new THREE.Mesh(new THREE.BoxGeometry(7,0.1,4),mat('#3a4048')); ground.position.y=-0.95; scene.add(ground);
function box(w,h,d,c){return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));}
function cyl(r,h,c,seg=20){return new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),mat(c));}
const block=box(3.6,1.4,1.6,'#9aa0a8'); block.position.y=0.2; engine.add(block);
for(let i=0;i<4;i++){const b=cyl(0.33,0.02,'#555'); b.position.set(-1.2+0.8*i,0.91,0.15); engine.add(b);}
const pan=box(3.3,0.4,1.4,'#7d838b'); pan.position.y=-0.7; engine.add(pan);
const crank=cyl(0.32,0.15,'#666'); crank.rotation.z=Math.PI/2; crank.position.set(1.88,-0.2,-0.2); engine.add(crank);
const markCrank=box(0.04,0.08,0.06,'#444'); markCrank.position.set(1.97,0.12,-0.2); engine.add(markCrank);
// 排气：贴在缸体前侧（+Z），低于缸盖安装面，避免穿模
const exh=new THREE.Group();
for(let i=0;i<4;i++){
  const p=box(0.22,0.22,0.55,'#8a5a3c');
  p.position.set(-1.2+0.8*i,0.48,1.12); // 更靠前、更低，避免与缸盖轮廓糊在一起
  exh.add(p);
}
const ec=box(2.8,0.28,0.28,'#8a5a3c'); ec.position.set(0,0.4,1.35); exh.add(ec);
const tail=cyl(0.14,0.7,'#6d4a33'); tail.rotation.z=Math.PI/2; tail.position.set(-1.7,0.4,1.35); exh.add(tail);
engine.add(exh);
// 烟源放在默认视角可见的排气口前方
const TAIL_END=new THREE.Vector3(-1.4,0.55,1.7);
function label(txt,pos,col='#ffffff',sc=1.2){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.font='bold 30px sans-serif';g.fillStyle=col;g.textAlign='center';g.fillText(txt,128,42);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.renderOrder=10;s.scale.set(sc,sc*0.25,1);s.position.set(...pos);scene.add(s);return s;}
label('排气侧',[0,0.15,2.1],'#e0a070',1.3);label('进气侧',[0,0.15,-2.1],'#8fb0e0',1.3);
// 「正时」缩短并内移，避免右缘裁切
label('正时',[2.15,0.1,0.55],'#ffd166',1.0);

function makePart(type){const g=new THREE.Group();
 switch(type){
  case 'head':{const m=box(3.6,0.5,1.6,'#c9ccd1');g.add(m);for(let i=0;i<4;i++){const h=cyl(0.1,0.02,'#333');h.position.set(-1.2+0.8*i,0.26,0.15);g.add(h);}const cp=cyl(0.3,0.12,'#bbb');cp.rotation.z=Math.PI/2;cp.position.set(1.88,0.15,-0.2);g.add(cp);const mk=box(0.04,0.08,0.06,'#444');mk.position.set(1.95,0.47,-0.2);g.add(mk);break;}
  case 'cam':{const s=cyl(0.09,3.3,'#d9b26f');s.rotation.z=Math.PI/2;g.add(s);for(let i=0;i<8;i++){const l=box(0.12,0.26,0.16,'#c49a52');l.position.set(-1.4+0.4*i,0,0);g.add(l);}break;}
  case 'plug':{const b=cyl(0.07,0.35,'#e8e8e8');b.position.y=0.05;g.add(b);const t=cyl(0.1,0.12,'#999',6);t.position.y=-0.12;g.add(t);break;}
  case 'coil':{const r=box(3.0,0.22,0.35,'#d04848');g.add(r);for(let i=0;i<4;i++){const n=cyl(0.09,0.22,'#222');n.position.set(-1.2+0.8*i,-0.18,0);g.add(n);}break;}
  case 'intake':{const pl=box(3.0,0.55,0.35,'#6f8fb8');pl.position.z=-0.25;g.add(pl);for(let i=0;i<4;i++){const r=box(0.22,0.22,0.5,'#6f8fb8');r.position.set(-1.2+0.8*i,-0.1,0.15);g.add(r);}const th=cyl(0.2,0.3,'#555');th.rotation.z=Math.PI/2;th.position.set(-1.65,0,-0.25);g.add(th);break;}
  case 'belt':{const shape=new THREE.Shape();const w=0.36,h0=-0.95,h1=1.1;shape.absarc(0,h0,w,Math.PI,0,false);shape.absarc(0,h1,w,0,Math.PI,false);const hole=new THREE.Path();hole.absarc(0,h0,w-0.08,Math.PI,0,false);hole.absarc(0,h1,w-0.08,0,Math.PI,false);shape.holes.push(hole);const m=new THREE.Mesh(new THREE.ExtrudeGeometry(shape,{depth:0.12,bevelEnabled:false}),mat('#2a2a2a'));m.rotation.y=Math.PI/2;g.add(m);break;}
  case 'wrench':{const h=box(1.1,0.1,0.18,'#8d99a6');g.add(h);const j=new THREE.Mesh(new THREE.TorusGeometry(0.17,0.07,8,16,Math.PI*1.5),mat('#8d99a6'));j.position.x=0.68;j.rotation.z=Math.PI*0.75;g.add(j);const r=new THREE.Mesh(new THREE.TorusGeometry(0.14,0.06,8,16),mat('#8d99a6'));r.position.x=-0.65;g.add(r);break;}
  case 'spring':{class H extends THREE.Curve{getPoint(t){const a=t*Math.PI*2*6;return new THREE.Vector3(0.22*Math.cos(a),t*0.9-0.45,0.22*Math.sin(a));}}const m=new THREE.Mesh(new THREE.TubeGeometry(new H(),160,0.035,6),mat('#b8c0c8'));g.add(m);break;}
  case 'faucet':{const body=cyl(0.16,0.5,'#c8a24a');body.rotation.z=Math.PI/2;g.add(body);const st=cyl(0.04,0.25,'#c8a24a');st.position.y=0.25;g.add(st);const wh=new THREE.Mesh(new THREE.TorusGeometry(0.2,0.04,6,16),mat('#d33'));wh.rotation.x=Math.PI/2;wh.position.y=0.38;g.add(wh);const sp=box(0.08,0.08,0.08,'#d33');sp.position.y=0.38;g.add(sp);for(const s of[-1,1]){const n=cyl(0.1,0.12,'#a8862f',6);n.rotation.z=Math.PI/2;n.position.x=0.31*s;g.add(n);}break;}
  case 'banana':{const m=new THREE.Mesh(new THREE.TorusGeometry(0.4,0.1,8,16,Math.PI*0.8),mat('#f3d34a'));g.add(m);break;}
 } return g;}

// ---------- 碰撞体（AABB 近似，随已装零件扩展） ----------
function worldAABB(mesh){
  const b=new THREE.Box3().setFromObject(mesh);
  return b;
}
function colliders(){
  const list=[];
  // 缸体 + 油底壳
  list.push(new THREE.Box3(new THREE.Vector3(-1.85,-0.95,-0.85),new THREE.Vector3(1.85,0.92,0.85)));
  // 排气
  list.push(new THREE.Box3(new THREE.Vector3(-2.1,0.2,0.85),new THREE.Vector3(1.5,0.75,1.55)));
  // 曲轴皮带轮
  list.push(new THREE.Box3(new THREE.Vector3(1.7,-0.45,-0.45),new THREE.Vector3(2.1,0.05,0.05)));
  // 已装零件
  for(const s of SLOTS){
    if(!slotState[s.id].done) continue;
    const g=ghosts[s.id]; // use installed mesh if tracked
    if(installedMeshes[s.id]){
      list.push(new THREE.Box3().setFromObject(installedMeshes[s.id]));
    } else {
      // fallback approximate
      const p=s.pos, r=PART_RADIUS[s.part]||0.4;
      list.push(new THREE.Box3(
        new THREE.Vector3(p[0]-r,p[1]-r,p[2]-r),
        new THREE.Vector3(p[0]+r,p[1]+r,p[2]+r)));
    }
  }
  return list;
}
function resolveCollision(pos, radius){
  // 地面
  if(pos.y < -0.7+radius) pos.y = -0.7+radius;
  const boxes=colliders();
  for(const b of boxes){
    // 最近点
    const cx=Math.max(b.min.x, Math.min(pos.x, b.max.x));
    const cy=Math.max(b.min.y, Math.min(pos.y, b.max.y));
    const cz=Math.max(b.min.z, Math.min(pos.z, b.max.z));
    let dx=pos.x-cx, dy=pos.y-cy, dz=pos.z-cz;
    let d2=dx*dx+dy*dy+dz*dz;
    if(d2 < 1e-8){
      // 中心在盒子内：沿最小穿透轴推出
      const pxL=pos.x-b.min.x, pxR=b.max.x-pos.x;
      const pyL=pos.y-b.min.y, pyR=b.max.y-pos.y;
      const pzL=pos.z-b.min.z, pzR=b.max.z-pos.z;
      const m=Math.min(pxL,pxR,pyL,pyR,pzL,pzR);
      if(m===pxL) pos.x=b.min.x-radius;
      else if(m===pxR) pos.x=b.max.x+radius;
      else if(m===pyL) pos.y=b.min.y-radius;
      else if(m===pyR) pos.y=b.max.y+radius;
      else if(m===pzL) pos.z=b.min.z-radius;
      else pos.z=b.max.z+radius;
    } else if(d2 < radius*radius){
      const d=Math.sqrt(d2);
      const k=(radius-d)/d;
      pos.x+=dx*k; pos.y+=dy*k; pos.z+=dz*k;
    }
  }
  return pos;
}

const clipEl=document.getElementById('planeclip');
const pusherEl=document.getElementById('pusher');

const CARD_W=60;          // 窄卡，竖立
const CARD_H=88;
const RAIL_Y=150;         // 滑台顶面在 feed 内的 y
const CARD_TOP=RAIL_Y-CARD_H-50; // planeclip top=50 → 卡底边贴滑台线

const icons={};

 const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});r.setSize(132,120);
 const s=new THREE.Scene();s.add(new THREE.HemisphereLight(0xffffff,0x445566,1));const d=new THREE.DirectionalLight(0xffffff,0.7);d.position.set(3,5,4);s.add(d);
 const m=makePart(type);s.add(m);const bb=new THREE.Box3().setFromObject(m);const size=bb.getSize(new THREE.Vector3()).length();const c=bb.getCenter(new THREE.Vector3());m.position.sub(c);
 const cm=new THREE.PerspectiveCamera(35,132/120,0.1,100);cm.position.set(size*0.9,size*0.7,size*1.2);cm.lookAt(0,0,0);r.render(s,cm);

let pipeQueue=[], onPlane=[], paused=false;
let beatT=0, pushedThisBeat=false, dropDoneThisBeat=false, pusherX=0, pusherV=0;

function planeWidth(){return clipEl.clientWidth || Math.max(200, feedEl.clientWidth-28);}
function makeCard(type){
  const el=document.createElement('div'); el.className='card';
  el.innerHTML=`<img class="ic" src="${iconFor(type)}"><div class="nm">${PARTS[type].name}</div>`;
  clipEl.appendChild(el); return el;
}
function initFeed(){
  clipEl.innerHTML=''; smokesEl.innerHTML='';
  pipeQueue=['plug','cam','head','wrench','plug','intake','plug','spring','belt','plug','coil','faucet','banana'];
  onPlane=[]; beatT=0; pushedThisBeat=false; dropDoneThisBeat=false; pusherX=0; pusherV=0; feedStarted=false;
  pusherEl.style.transform='translateX(0)';
  // 初始：从挡板右侧一张卡宽处开始，等间距排开，绝不重叠
  const W=planeWidth(); let x=PUSH_DIST;
  while(pipeQueue.length && x+CARD_W<=W){
    const t=pipeQueue.shift();
    onPlane.push({type:t,x,vx:0,el:makeCard(t),y:0,vy:0,falling:false});
    x+=CARD_W+6;
  }
  renderFeed();
}
function activeCards(){return onPlane.filter(c=>!c.falling);}
function spitSmoke(){
  for(let i=0;i<8;i++){
    const d=document.createElement('div'); d.className='puff';
    const vx=-30+Math.random()*60, vy=10+Math.random()*30;
    smokesEl.appendChild(d);
    const born=performance.now(), life=700+Math.random()*400;
    (function frame(now){
      const t=(now-born)/life;
      if(t>=1){ d.remove(); return; }
      // 吐出后向上飘散
      d.style.transform=`translate(${vx*t}px,${vy*t-60*t*t}px) scale(${1+t*2})`;
      d.style.opacity=String(0.85*(1-t));
      requestAnimationFrame(frame);
    })(born);
  }
}
function nodPipe(){
  const pipe=document.getElementById('pipe');
  pipe.classList.remove('spit'); void pipe.offsetWidth; pipe.classList.add('spit');
}
function tryDropFromPipe(){
  nodPipe();
  if(!pipeQueue.length){ spitSmoke(); return; }   // 只有真没料才吐烟
  const t=pipeQueue.shift();
  // 从管口竖直落下，落在挡板右侧刚腾出的空位
  onPlane.push({type:t,x:4,vx:0,el:makeCard(t),y:-CARD_H-10,vy:0,falling:false,landing:true});
}
function startFall(it){
  it.falling=true; it.vy=-40; it.rot=0; it.vr=180+Math.random()*120;
  const step=()=>{
    const dt=0.016;
    it.vy+=G*dt; it.y+=it.vy*dt; it.x+=it.vx*dt*0.6; it.rot+=it.vr*dt;
    it.el.style.transform=`translate(${it.x.toFixed(1)}px,${it.y.toFixed(1)}px) rotate(${it.rot.toFixed(1)}deg)`;
    if(it.y<260) requestAnimationFrame(step);
    else{ it.el.remove(); const i=onPlane.indexOf(it); if(i>=0) onPlane.splice(i,1); pipeQueue.push(it.type); }
  };
  requestAnimationFrame(step);
}
function stepPhysics(dt){
  const W=planeWidth();
  const cards=activeCards().sort((a,b)=>a.x-b.x);
  for(const c of cards){
    // 水平：低摩擦恒减速
    if(c.vx>0){ c.vx=Math.max(0,c.vx-DECEL*dt); c.x+=c.vx*dt; }
    // 竖直：从管口落下，落地小弹跳
    if(c.landing){
      c.vy+=G*dt; c.y+=c.vy*dt;
      if(c.y>=0){ c.y=0; if(c.vy>220){ c.vy=-c.vy*0.18; } else { c.vy=0; c.landing=false; } }
    }
  }
  // 挡板 → 第一张接触的卡（只在接触时传递）
  for(const c of cards){
    if(c.landing && c.y<-30) continue; // 还在空中，挡板碰不到
    if(c.x<pusherX){ c.x=pusherX; if(pusherV>0) c.vx=Math.max(c.vx,pusherV); }
    break;
  }
  // 卡与卡：一维刚体接触，紧贴即传递速度，绝不重叠；未接触的卡不受影响
  for(let i=0;i<cards.length-1;i++){
    const a=cards[i], b=cards[i+1];
    if(b.x < a.x+CARD_W){
      b.x=a.x+CARD_W;
      if(a.vx>b.vx){ const v=(a.vx+b.vx)/2; a.vx=v; b.vx=v; } // 等质量完全非弹性
    }
  }
  // 右端断口：重心越过台边就掉
  for(const c of cards) if(c.x+CARD_W/2>W) startFall(c);
}
function stepBeat(dt){
  beatT+=dt;
  if(beatT>=BEAT){ beatT-=BEAT; pushedThisBeat=false; dropDoneThisBeat=false; }
  let nx=0;
  if(beatT<PUSH_OUT){ const k=beatT/PUSH_OUT; nx=PUSH_DIST*(k*k*(3-2*k)); }
  else if(beatT<PUSH_OUT+PUSH_BACK){ const k=(beatT-PUSH_OUT)/PUSH_BACK; nx=PUSH_DIST*(1-k*k*(3-2*k)); pushedThisBeat=true; }
  pusherV=dt>0?(nx-pusherX)/dt:0; pusherX=nx;
  if(beatT>=DROP_AT && !dropDoneThisBeat){ dropDoneThisBeat=true; tryDropFromPipe(); }
}
function renderFeed(){
  pusherEl.style.transform=`translateX(${pusherX.toFixed(1)}px)`;
  for(const it of onPlane){ if(it.falling) continue;
    it.el.style.transform=`translate(${it.x.toFixed(2)}px, ${it.y.toFixed(2)}px)`; }
}
function stepFeed(dt){

function cardAt(x){

// ---------- 3D 拖拽 ----------
let drag=null; const LIFT=60, SNAP=56, SNAP_AUTO=34;
const ray=new THREE.Raycaster(), plane3=new THREE.Plane(), tmpV=new THREE.Vector3();
function screenTo3D(x,y){
  const r=renderer.domElement.getBoundingClientRect();
  const n=new THREE.Vector2((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1);
  ray.setFromCamera(n,camera);
  camera.getWorldDirection(tmpV);
  plane3.setFromNormalAndCoplanarPoint(tmpV.clone().negate(), new THREE.Vector3(0,1.1,0));
  const out=new THREE.Vector3();
  if(!ray.ray.intersectPlane(plane3,out)) return new THREE.Vector3(0,1,0);
  return out;
}
function slotScreen(s){
  const v=new THREE.Vector3(...s.pos).project(camera);
  const r=renderer.domElement.getBoundingClientRect();
  return{x:r.left+(v.x+1)/2*r.width, y:r.top+(1-v.y)/2*r.height};
}
function nearestSlot(x,y,filter){
  let best=null, bd=1e9;
  SLOTS.forEach(s=>{
    if(!filter(s)) return;
    const p=slotScreen(s); const d=Math.hypot(p.x-x,p.y-y);
    if(d<bd){bd=d;best=s;}
  });
  return{s:best,d:bd};
}
function startDrag(it,e){
  setLift(null); sel=null; paused=false; if(!feedStarted){feedStarted=true;} updFeedState();
  const idx=onPlane.indexOf(it); if(idx>=0) onPlane.splice(idx,1);
  it.el.remove();
  const m=makePart(it.type);
  const p=screenTo3D(e.clientX, e.clientY-LIFT);
  m.position.copy(p); m.scale.setScalar(0.4);
  engine.add(m);
  drag={type:it.type, m, x:e.clientX, y:e.clientY-LIFT, fy:e.clientY, vel:new THREE.Vector3(), hot:null, snapHold:0};
  resetHint(it.type);

}
addEventListener('pointermove',e=>{

function hotSlot(){ return nearestSlot(drag.x, drag.y, s=>s.part===drag.type && !slotState[s.id].done && unlocked(s)); }
let drops=0, junk=0;
const falling=[], snapping=[];

function endDrag(cancel){
  const d=drag; drag=null; showMarks(false);
  const br=feedEl.getBoundingClientRect();
  // 松手放回料道
  if(!cancel && d.fy > br.top-10 && !PARTS[d.type].fake){
    engine.remove(d.m); pipeQueue.unshift(d.type); clearHint(); return;
  }
  if(PARTS[d.type].fake){ junk++; fall(d,null); toast(PARTS[d.type].quip,'info'); clearHint(); return; }
  // 只有未吸附成功才掉落（吸附成功已在 loop 里免松手安装）
  const good=nearestSlot(d.x,d.y,s=>s.part===d.type&&!slotState[s.id].done&&unlocked(s));
  if(!cancel && good.s && good.d < SNAP){ snapIn(d.m, good.s); return; }
  let msg;
  const locked=nearestSlot(d.x,d.y,s=>s.part===d.type&&!slotState[s.id].done&&!unlocked(s));
  const other=nearestSlot(d.x,d.y,s=>s.part!==d.type);
  if(locked.s&&locked.d<SNAP) msg='🔒 '+NEED_TXT[d.type];
  else if(other.s&&other.d<SNAP*0.9&&other.d<(good.s?good.d:1e9)) msg='放错位置了：'+WRONG[d.type];
  else if(good.s&&good.d<SNAP*2.6) msg='没装到位，再靠近点（对着轮廓影子）。';
  else msg='没装上，掉下去了。半透明轮廓就是可装位置。';
  drops++; fall(d,d.type); toast(msg+' 它稍后会从料道回来。','bad'); clearHint();
}
function fall(d,returnType){

  document.getElementById('rTitle').textContent=tt;
  document.getElementById('rTime').textContent=sec.toFixed(1)+' 秒';
  document.getElementById('rDrops').textContent=drops+' 次';
  document.getElementById('rJunk').textContent=junk+' 件';
  document.getElementById('rNote').textContent=note+'（专业技师：60 秒内且零掉落）';
  document.getElementById('result').style.display='flex';
}
document.getElementById('again').onclick=()=>{sessionStorage.setItem('skipDemo','1');location.reload();};

// ---------- 开局示范手 ----------
const handEl=document.getElementById('hand'), demoCard=document.getElementById('demoCard'), demoTxt=document.getElementById('demoTxt');
const demo={on:!sessionStorage.getItem('skipDemo'), t:0};
sessionStorage.removeItem('skipDemo');
function stopDemo(){
  if(!demo.on) return; demo.on=false;
  handEl.style.display=demoCard.style.display=demoTxt.style.display='none';
  if(demo.lift) demo.lift.el.classList.remove('lift');
  tipEl.style.display='none'; paused=false; updFeedState();
}
addEventListener('pointerdown',e=>{if(demo.on) stopDemo(); if(t0===null) t0=performance.now();}, true);
function lerp(a,b,k){return a+(b-a)*k;}
function stepDemo(dt){
  demo.t=(demo.t+dt)%3.6; const t=demo.t;
  const it=onPlane.find(i=>i.type==='head' && !i.falling);
  if(!it){ return; }
  const pr=planeEl.getBoundingClientRect();
  const cr=clipEl.getBoundingClientRect(); const cx=cr.left+it.x+CARD_W/2, cy=cr.top+40;
  const tgt=slotScreen(SLOTS[0]);
  let hx,hy,lift=false,card=false;
  if(t<0.6){ hx=lerp(cx+60,cx,t/0.6); hy=lerp(cy+80,cy,t/0.6); paused=false; }
  else if(t<1.2){ hx=cx; hy=cy; lift=true; paused=true; }
  else if(t<2.6){ const k=(t-1.2)/1.4,e=k*k*(3-2*k); hx=lerp(cx,tgt.x,e); hy=lerp(cy,tgt.y+LIFT,e); lift=k<0.25; card=k>=0.25; paused=true; }
  else{ hx=tgt.x; hy=tgt.y+LIFT; card=true; paused=true; }
  updFeedState();
  handEl.style.display='block'; handEl.style.left=hx+'px'; handEl.style.top=hy+'px';
  if(lift){ demo.lift=it; it.el.classList.add('lift'); } else it.el.classList.remove('lift');
  if(card){ demoCard.src=iconFor('head'); demoCard.style.display='block'; demoCard.style.left=hx+'px'; demoCard.style.top=(hy-LIFT)+'px'; }
  else demoCard.style.display='none';
  demoTxt.style.display='block';
}

// ---------- 主循环 ----------
let t0=null, endT=0, last=performance.now(), shakeT=0;
function tryAutoInstall(){
  if(!drag || PARTS[drag.type].fake) return false;
  const h=hotSlot();
  if(h.s && h.d < SNAP_AUTO){
    // 吸稳即装，无需松手
    const m=drag.m, s=h.s;
    drag=null;
    snapIn(m,s);
    return true;
  }
  return false;
}
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(t0!==null && !finished) document.getElementById('time').textContent=((now-t0)/1000).toFixed(1);
  stepFeed(dt);
  if(demo.on) stepDemo(dt);

  // 犹豫计时
  if(hint.type && (sel||drag)) hint.t += dt;
  else if(!hint.type) hint.t=0;

  let dragHot=null;
  if(drag){
    const h=hotSlot();
    let tgt=screenTo3D(drag.x, drag.y);
    drag.hot=null;
    if(h.s && h.d < SNAP*1.6){
      const k=Math.max(0,1-h.d/(SNAP*1.6));
      tgt.lerp(new THREE.Vector3(...h.s.pos), 0.18+0.4*k);
      drag.hot=h.s; dragHot=h.s;
      if(h.d < SNAP_AUTO) drag.snapHold = (drag.snapHold||0)+dt;
      else drag.snapHold=0;
    } else drag.snapHold=0;
    if(drag.type==='belt') markAlign(h.s && h.d<SNAP);

    // 碰撞：不能穿进发动机
    const radius=PART_RADIUS[drag.type]||0.4;
    // 磁吸很近时允许进入槽位（不碰撞挡掉）
    const nearSnap = h.s && h.d < SNAP;
    if(!nearSnap) resolveCollision(tgt, radius*0.85);

    const m=drag.m;
    const prev=m.position.clone();
    m.position.lerp(tgt, 1-Math.pow(0.0005,dt));
    // 再做一次碰撞修正（跟随后）
    if(!nearSnap){
      resolveCollision(m.position, radius*0.85);
    }
    drag.vel.copy(m.position).sub(prev).divideScalar(Math.max(dt,1e-3));
    m.scale.setScalar(lerp(m.scale.x,1,1-Math.pow(0.001,dt)));
    m.rotation.z=lerp(m.rotation.z, THREE.MathUtils.clamp(-drag.vel.x*0.04,-0.5,0.5),0.2);
    m.rotation.x=lerp(m.rotation.x, THREE.MathUtils.clamp(drag.vel.y*0.04,-0.5,0.5),0.2);

    // 吸稳免松手安装
    if(drag.snapHold > 0.05 || (h.s && h.d < SNAP_AUTO*0.65)){
      tryAutoInstall();
    }
  }

  updateGhostVisuals(now, dragHot);

  for(let i=snapping.length-1;i>=0;i--){
    const o=snapping[i]; o.t=Math.min(1,o.t+dt*6);
    const k=1-Math.pow(1-o.t,3);
    o.m.position.lerpVectors(o.from, new THREE.Vector3(...o.s.pos), k);
    o.m.rotation.set(o.r0.x*(1-k), o.r0.y*(1-k), o.r0.z*(1-k));
    o.m.scale.setScalar(lerp(o.sc,1,k));
    if(o.t>=1){
      shakeT=0.12;
      installedMeshes[o.s.id]=o.m;
      snapping.splice(i,1);
      installed(o.s);
    }
  }
  for(let i=falling.length-1;i>=0;i--){
    const f=falling[i]; f.v.y-=14*dt;
    f.m.position.addScaledVector(f.v,dt);
    f.m.rotation.x+=f.spin.x*dt; f.m.rotation.y+=f.spin.y*dt; f.m.rotation.z+=f.spin.z*dt;
    if(f.m.position.y<-9){
      engine.remove(f.m); falling.splice(i,1);
      if(f.ret){ const t=f.ret; setTimeout(()=>pipeQueue.push(t),1200); }
    }
  }
  let sx=0,sy=0;
  if(shakeT>0){ shakeT-=dt; sx=Math.sin(now*0.08)*0.04; }
  if(ignited){
    ignT+=dt;
    const rpm=ignT<0.7?ignT/0.7*300:ignT<1.2?300+(ignT-0.7)/0.5*1300:ignT<2.2?1600-(ignT-1.2)*800:800;
    const r=Math.round(rpm+(ignT>2.2?Math.sin(now*0.01)*15:0));
    document.getElementById('rpmn').textContent=r+' rpm';
    document.getElementById('rpmt').textContent=ignT<0.7?'起动机转动……':ignT>1.0?'打着了！':'';
    if(ignT>1.0&&!puffed){
      puffed=true; puff();
      ['d1','d2','d3'].forEach((id,j)=>setTimeout(()=>document.getElementById(id).classList.add('off'),j*180));
    }
    const a=ignT<0.7?0.02:ignT<1.4?0.035:0.014;
    sx=Math.sin(now*0.09)*a; sy=Math.cos(now*0.11)*a;
    if(ignT>3.4&&!resultShown) showResult();
  }
  for(let i=smoke.length-1;i>=0;i--){
    const s=smoke[i]; s.t+=dt;
    s.m.position.addScaledVector(s.v,dt); s.v.multiplyScalar(0.97);
    s.m.scale.setScalar(1+s.t*2.2);
    s.m.material.opacity=0.7*Math.max(0,1-s.t/s.life);
    if(s.t>s.life){ scene.remove(s.m); smoke.splice(i,1); }
  }
  engine.position.set(sx,sy,0);
  updCam(); renderer.render(scene,camera); requestAnimationFrame(loop);
}

initFeed(); resize();
if(!demo.on) updFeedState();
requestAnimationFrame(loop);
window.__slice={
  slotScreen:id=>slotScreen(SLOTS.find(s=>s.id===id)),
  state:()=>({doneCount,ignited,drops,junk,queue:[...pipeQueue],belt:onPlane.map(i=>i.type),
    cards:onPlane.filter(c=>!c.falling).map(c=>({type:c.type,x:+c.x.toFixed(2),vx:+c.vx.toFixed(2),y:+c.y.toFixed(1)})),feedStarted,pusherX,fallingN:onPlane.filter(c=>c.falling).length,
    beatT, dropDoneThisBeat, paused, demo:demo.on, hint:{...hint}, version:'v5'}),
  dragPos:()=>drag?{x:drag.m.position.x,y:drag.m.position.y,z:drag.m.position.z,type:drag.type}:null,
  setCards:(arr)=>{onPlane.forEach(c=>c.el.remove());onPlane.length=0;arr.forEach(([t,x])=>onPlane.push({type:t,x,vx:0,y:0,vy:0,el:makeCard(t),falling:false}));beatT=0;pushedThisBeat=false;dropDoneThisBeat=false;},
  forceEmptyQueue:()=>{pipeQueue.length=0;},
  clearPlaneKeepOne:()=>{
    const keep=onPlane.find(c=>!c.falling);
    onPlane.slice().forEach(c=>{ if(c!==keep){ c.el.remove(); }});
    onPlane.length=0; if(keep){ keep.x=20; keep.vx=0; onPlane.push(keep);}
    pipeQueue.length=0;
  },
  version:'v5'
};
</script></body></html>
